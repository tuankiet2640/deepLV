global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "deeplv-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "api"

  - job_name: "deeplv-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8001"]
        labels:
          service: "worker"
