[project]
name = "deeplv"
version = "1.0.0"
description = "Production-grade machine translation system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "ctranslate2>=4.1.0",
    "sentencepiece>=0.2.0",
    "transformers>=4.41.0",
    "fasttext-langdetect>=1.0.5",
    "torch>=2.3.0",
    "openai>=1.30.0",
    "google-cloud-translate>=3.15.0",
    "python-docx>=1.1.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "reportlab>=5.0.0",
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
# These trigger false positives when ignore_missing_imports is on
# (third-party classes become Any, so subclassing/returning them errors)
disable_error_code = ["misc", "no-any-return", "type-arg", "union-attr", "attr-defined", "arg-type"]

# transformers ships py.typed from v5 onwards, so mypy now checks calls into it
# and flags tokenizer methods that upstream leaves unannotated (e.g. decode).
# Scoped to this module rather than fixed with an inline ignore: transformers is
# unpinned, and on a pre-v5 version the package has no types, which would turn
# the ignore into an unused-ignore error under strict mode.
[[tool.mypy.overrides]]
module = "src.worker.translator"
disallow_untyped_calls = false
