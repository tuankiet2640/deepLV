services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deeplv}
      POSTGRES_USER: ${POSTGRES_USER:-deeplv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deeplv_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deeplv}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MODEL_DIR: /app/models
      MODEL_CACHE_SIZE: ${MODEL_CACHE_SIZE:-6}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deeplv}:${POSTGRES_PASSWORD:-deeplv_dev_password}@postgres:5432/${POSTGRES_DB:-deeplv}
      REDIS_URL: redis://redis:6379/0
      MODEL_WORKER_URL: http://worker:8001
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production-please}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  models:
