# ============================================================
# DeepLV — Production Docker Compose
# ============================================================
# Usage:
#   cp .env.production .env   # then fill in your values
#   docker compose -f docker-compose.prod.yml up --build -d
#
# For Raspberry Pi / ARM64:
#   DOCKER_DEFAULT_PLATFORM=linux/arm64 docker compose -f docker-compose.prod.yml up --build -d
#
# Architecture:
#   Cloudflare Tunnel -> nginx (frontend + API proxy) -> FastAPI API -> Redis cache
#                                                                   -> Supabase (external PG)
#                                                                   -> Model Worker (MarianMT)
# ============================================================

services:
  # --- Cloudflare Tunnel (replaces need for public IP / port forwarding) ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Redis (local cache + rate limiting) ---
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # --- Model Worker (MarianMT / CTranslate2) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MODEL_DIR: /app/models
      MODEL_CACHE_SIZE: ${MODEL_CACHE_SIZE:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # --- API Gateway (FastAPI) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      MODEL_WORKER_URL: http://worker:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ADMIN_OPENAI_KEY: ${ADMIN_OPENAI_KEY:-}
      ADMIN_HUGGINGFACE_KEY: ${ADMIN_HUGGINGFACE_KEY:-}
      ADMIN_GOOGLE_KEY: ${ADMIN_GOOGLE_KEY:-}
      CREDIT_COST_PER_1K_CHARS: ${CREDIT_COST_PER_1K_CHARS:-5.0}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Frontend (nginx serves React + proxies /api to backend) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # --- Prometheus (metrics collection) ---
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=1GB"
    depends_on:
      - api
      - worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # --- Grafana (dashboards) ---
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
  models:
  prometheus-data:
  grafana-data:
