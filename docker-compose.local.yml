# ============================================================
# DeepLV — Local / Port Forwarding Deployment
# ============================================================
# Use this if you DON'T want Cloudflare Tunnel and prefer
# direct port forwarding from your router instead.
#
# Usage:
#   cp .env.production .env   # fill in your values
#   docker compose -f docker-compose.local.yml up --build -d
#
# Your app will be available at:
#   http://YOUR_LOCAL_IP:3000  (LAN)
#   http://YOUR_PUBLIC_IP:3000 (Internet, after port forwarding)
#   https://yourdomain.com     (if you set up DNS + reverse proxy)
#
# Port forwarding setup:
#   Router → forward external port 80 → your machine port 3000
#   Router → forward external port 443 → your machine port 3000 (if using SSL)
# ============================================================

services:
  # --- Redis (local cache + rate limiting) ---
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # --- Model Worker (MarianMT / CTranslate2) ---
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      MODEL_DIR: /app/models
      MODEL_CACHE_SIZE: ${MODEL_CACHE_SIZE:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # --- API Gateway (FastAPI) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      MODEL_WORKER_URL: http://worker:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      ADMIN_OPENAI_KEY: ${ADMIN_OPENAI_KEY:-}
      ADMIN_HUGGINGFACE_KEY: ${ADMIN_HUGGINGFACE_KEY:-}
      ADMIN_GOOGLE_KEY: ${ADMIN_GOOGLE_KEY:-}
      CREDIT_COST_PER_1K_CHARS: ${CREDIT_COST_PER_1K_CHARS:-5.0}
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Frontend (nginx + React, exposed directly) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  # --- Prometheus (metrics collection) ---
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=1GB"
    depends_on:
      - api
      - worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # --- Grafana (dashboards) ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
  models:
  prometheus-data:
  grafana-data:
